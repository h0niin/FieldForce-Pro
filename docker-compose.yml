services:
  # ── PostgreSQL Database ────────────────────────────────────
  fsm-db:
    image: postgres:15.3
    container_name: fsm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fieldforce_pro
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fsm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (cache + Celery broker) ──────────────────────────
  fsm-redis:
    image: redis:7-alpine
    container_name: fsm-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - fsm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend API ─────────────────────────────────────
  fsm-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fsm-server
    restart: unless-stopped
    depends_on:
      fsm-db:
        condition: service_healthy
      fsm-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_HOST=fsm-redis
      - REDIS_PORT=6379
    ports:
      - "3213:3213"
    networks:
      - fsm-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3213/api/docs-json',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── FastAPI AI/ML Service ──────────────────────────────────
  fsm-ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: fsm-ai
    restart: unless-stopped
    depends_on:
      fsm-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_HOST=fsm-redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://fsm-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://fsm-redis:6379/2
    networks:
      - fsm-network

  # ── React Frontend + Nginx Proxy ───────────────────────────
  fsm-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-FieldForce Pro}
    container_name: fsm-web
    restart: unless-stopped
    depends_on:
      fsm-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3123}:80"
    networks:
      - fsm-network

networks:
  fsm-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
